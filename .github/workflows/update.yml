name: Update monochromium formula

on:
  schedule:
    # Check Monochromium's GitHub releases for a new version every 6 hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump formula to latest GitHub release
        env:
          REPO: Papaya-Voldemort/Monochromium
          FORMULA: Formula/monochromium.rb
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/$REPO/releases/latest"
          tag=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" "$api" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          version=${tag#v}
          asset="monochromium-v${version}-macos-universal"
          download_url="https://github.com/$REPO/releases/download/$tag/$asset"

          current=$(sed -n "s|^  url \".*/download/v\([0-9.]*\)/.*\"$|\1|p" "$FORMULA")

          echo "Latest GitHub release: $version (formula has: $current)"

          if [ -z "$tag" ] || [ -z "$version" ] || [ -z "$current" ]; then
            echo "Failed to resolve release tag or current formula version" >&2
            exit 1
          fi

          if [ "$version" = "$current" ]; then
            echo "Formula is up to date; nothing to do."
            exit 0
          fi

          checksum=$(curl -fsSL "https://github.com/$REPO/releases/download/$tag/SHA256SUMS" \
            | awk -v a="$asset" '$2 ~ "/"a"$" {print $1}')

          if [ -z "$checksum" ]; then
            echo "No checksum for $asset in SHA256SUMS" >&2
            exit 1
          fi

          echo "New version: $version (sha256 $checksum)"

          sed -i "s|^  url \".*\"$|  url \"$download_url\"|" "$FORMULA"
          sed -i "s|^  sha256 \".*\"$|  sha256 \"${checksum}\"|" "$FORMULA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          git commit -m "monochromium $version"
          git push
